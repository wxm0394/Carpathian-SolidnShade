# generated full-screen quad + simple_shader material for the main menu background
# (mesh main_menu_background -> ss_main_menu -> ss_menu_bg). ss_menu_bg.dds is a
# baked 1280x720 composite (bg2 parchment + warrider_logo title + pic_mercenary skull,
# skull on the RIGHT to clear WB's fixed left-aligned menu list). UVs v-flipped -> upright.
load_mod_resource = ss_main_menu
# loading-screen background: full-screen bg2 parchment (mesh loading_background ->
# ss_loading -> ss_loading_bg). S&S's 1011 meshes.txt lacked the loading_background
# slot Native maps to load_screen_2, so this restores a proper loading background.
load_mod_resource = ss_loading
# force the module's paper-composited escape-menu pics to win over the core-declared
# base-game textures (pic_mb_warrior_1 / pic_horse_archers exist in Warband/Textures and
# are bound by 'load_resource = textures' above). Declared late so the module DDS binds.
load_mod_resource = ss_pics
# NOTE: the ESC-screen paper (mesh_ss_escbg, index 738) does NOT need a custom BRF --
# it points straight at Warband's native UI mesh 'meeting_window' (core_ui_meshes.brf),
# which is already a bg2-parchment quad built for the overlay pass. See module_meshes.py.
load_mod_resource = nymphhands
load_mod_resource = corporealhands
load_mod_resource = phoenix

# --- port fix: Warband CommonRes BRFs Native declares but S&S did not load
# (neither declared nor auto-loaded by the compat path). fur_armors_a &
# full_plate_armor hold armor meshes/LODs -> without them, nomad/khergit/plate
# bodies render invisible in map conversations. See PORTING_NOTES.md.
load_resource = fur_armors_a
load_resource = full_plate_armor
# --- port fix (HUD, 2026-07-12). Why CommonRes user_interface_b is NOT loaded here:
# S&S draws its own HP bar (prsnt_hp_hud) and relies on the engine's built-in bar being
# invisible -- achieved by zeroing status_health_bar's geometry in the module's own
# user_interface_b.brf. But the engine ALWAYS prefers the core-format (rfver) BRF's mesh
# over the mod's 1011-format one when both define a name, no matter what order they load
# in. So while CommonRes's copy was loaded, its un-zeroed status_health_bar drew a 2nd
# green bar and its smaller status_background_player replaced the frame. Reordering does
# NOT help -- this was verified in both directions.
#load_resource = user_interface_b
load_resource = user_interface_c
# The module's 1011-format atlas: zeroed status_health_bar (engine bar hidden; prsnt_hp_hud
# draws the real one) + the big cloned status_background_player/_horse frames.
load_mod_resource = user_interface_b
# Verbatim copy of CommonRes\user_interface_b.brf, loaded module-side to supply the ~121
# WB-only meshes the 1011 atlas lacks (scrollbars, small_arrow_*, text_box_*, kill-feed
# ico_*, status_ammo_ready). Its 10 status_* meshes are RENAMED IN THE FILE (status_health_bar
# -> status_health_baZ, etc; see Resource/wb_ui_b.brf.orig) so they no longer answer to the
# names the engine's HUD looks up -- that is what lets the mod's copies above win. Renaming
# is done in place: BRF strings are length-prefixed, so the name must keep its length.
load_mod_resource = wb_ui_b
# custom overlay bar mesh (clone of status_health_bar geometry+UVs, renamed) used by
# prsnt_hp_hud. Must stay AFTER user_interface_b so its material is already resolved.
load_mod_resource = hud_hp_shadow
